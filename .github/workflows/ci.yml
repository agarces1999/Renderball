# Minimal CI (launch audit): prove the code type-checks, the 600+ assertion
# suite passes, and `next build` actually succeeds — the production build had
# never been verifiably run before deploy. No deploy from here; Railway builds
# the Docker image on push.
name: ci

on:
  push:
    branches: [main, launch-deploy]
  pull_request:

# One run per branch. Pushing again supersedes the one in flight and CANCELS it,
# which matters most for postdeploy-smoke: it waits up to 15 minutes for
# production to serve ITS commit, and a newer push guarantees that commit is
# never served — so every rapid follow-up push turned an earlier run red by
# construction. Six failure emails in one morning, almost none of them a real
# defect. A cancelled run does not email; a failed one does, and that difference
# is the whole point.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A REAL database, because five suites need one — tenancy, share links,
    # document delete, user delete and the resilience checks. Without
    # DATABASE_URL they did not skip, they CRASHED the runner mid-suite, and
    # every push to this branch went red: 40 consecutive failures with zero
    # successes, for long enough that the notification stopped meaning
    # anything. Those five cover ownership isolation and deletion — the
    # suites you least want unrun — so the fix is to give CI a database, not
    # to skip them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renderball_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renderball_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # The schema must exist before any suite touches it.
      - run: npx prisma migrate deploy
      # The render-truth suite (animation-clock.test.ts) renders REAL MP4
      # frames and extracts them with system ffmpeg — not on the runner image.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx tsc --noEmit
      # tsc --noEmit above reads only the product scope (app/lib/components/src).
      # qa/ and scripts/ live outside it, so they need their own pass or they go
      # unchecked in CI exactly as they did locally.
      - run: npm run typecheck:qa
      - run: node scripts/run-tests.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Build-time-only placeholders: pages are dynamic (no DB access at build),
      # and Clerk needs a format-valid publishable key present to compile.
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic

  # ── QA: drive the real product in a real browser ─────────────────────────────
  # The unit suite above and this job answer different questions. `run-tests`
  # asks whether the code is correct in isolation; this asks whether the product
  # still works when its parts are put together — which is where every bug the
  # founder found by hand on 2026-08-21 was living.
  #
  # It needs a DOCUMENT to drive, and src/generated/ is gitignored, so a fresh
  # checkout has none. Before this job existed, wiring the suite into CI would
  # have produced a suite with nothing to drive and a sweep that scanned zero
  # directories and passed — green, and meaningless. scripts/qa-fixture.mjs puts
  # one small committed deck (qa/fixtures/deck) on disk and in the database.
  #
  # SCOPE, deliberately: the seam flows plus the invariant sweep, both green and
  # fast. Six of the editor/journey flows are currently red for reasons not yet
  # diagnosed; wiring those in today would make CI red on every push and teach
  # everyone to ignore it, which costs more than the coverage buys. They get
  # added back as they are resolved — the QA_ONLY line below is the ratchet.
  #
  # Against `next dev`, not a production build: /dev/edit is NODE_ENV-gated off
  # in production on purpose, and it is the surface the harness drives.
  qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renderball_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renderball_qa
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder
      # 127.0.0.1, NOT localhost. Two seam flows failed in CI — and only in CI —
      # with `page.goto: net::ERR_NAME_NOT_RESOLVED at http://localhost:3000`,
      # for a host other flows in the same run reached without trouble. On a
      # GitHub runner Chromium can resolve `localhost` to ::1 while the dev
      # server is listening on IPv4, so the first navigation in a fresh browser
      # context intermittently finds nothing there. An IP address has no DNS
      # step to get wrong. (Diagnosed 2026-08-22 after a wrong first guess that
      # blamed the route interceptor.)
      QA_BASE: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium

      - name: Put the fixture document on disk and in the database
        run: node scripts/qa-fixture.mjs

      # Files only — no server needed, and it fails loudly on a fixture whose
      # store has drifted from its render source.
      - name: Invariant sweep
        run: npx tsx scripts/invariants.ts

      - name: Start the dev server
        run: |
          npm run dev:raw > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://127.0.0.1:3000/api/health > /dev/null; then
              echo "dev server up after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::dev server never came up"; tail -40 /tmp/dev.log; exit 1

      # The subject is whatever qa-fixture.mjs pinned — no env override, so the
      # suite cannot silently change what it is testing.
      - name: QA — seam flows
        run: QA_ONLY=seam node scripts/run-qa.mjs

      - name: Dev server log on failure
        if: failure()
        run: tail -80 /tmp/dev.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qa-screenshots
          path: .data/qa/
          if-no-files-found: ignore

  # ── POST-DEPLOY SMOKE (founder, 2026-08-14: "fix the QA process so every
  # time you deploy a fix I am not the first one to notice it doesn't work").
  # Railway auto-deploys every push to launch-deploy regardless of CI. This
  # job waits for production to actually SERVE the pushed commit, then smokes
  # the public surface. A deploy that never flips, or flips and breaks, turns
  # CI red — and CI failure emails already reach the founder. The founder must
  # never be the first tester again; this job is the floor (full authed
  # journeys on prod additionally need a prod QA account — founder-side).
  postdeploy-smoke:
    if: github.ref == 'refs/heads/launch-deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production to serve this commit
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          echo "waiting for renderball.com to serve $SHORT"
          for i in $(seq 1 60); do
            C=$(curl -s --max-time 10 https://renderball.com/api/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit','?'))" 2>/dev/null || echo "?")
            if [ "$C" = "$SHORT" ]; then echo "deployed: $C"; exit 0; fi
            sleep 15
          done
          echo "::error::production never served $SHORT (still on $C) — the deploy failed or hung"
          exit 1
      - name: Health checks all green
        run: |
          BODY=$(curl -s --max-time 10 https://renderball.com/api/health)
          echo "$BODY"
          echo "$BODY" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          bad=[k for k,v in d.get('checks',{}).items() if v not in ('ok','not-configured')]
          assert d.get('status')=='ok' and not bad, f'unhealthy: {d.get(\"status\")} {bad}'
          "
      - name: Public surface answers correctly
        run: |
          set -e
          code() { curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$1"; }
          [ "$(code https://renderball.com/)" = "200" ] || { echo "::error::landing broken"; exit 1; }
          [ "$(code 'https://renderball.com/api/documents/generate/stream?scriptId=x')" = "401" ] || { echo "::error::stream route unguarded or dead"; exit 1; }
          [ "$(code 'https://renderball.com/api/preview/provenance?scriptId=x')" != "500" ] || { echo "::error::provenance route 500s"; exit 1; }
          echo "public surface ok"
