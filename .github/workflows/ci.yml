# Minimal CI (launch audit): prove the code type-checks, the 600+ assertion
# suite passes, and `next build` actually succeeds — the production build had
# never been verifiably run before deploy. No deploy from here; Railway builds
# the Docker image on push.
name: ci

on:
  push:
    branches: [main, launch-deploy]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A REAL database, because five suites need one — tenancy, share links,
    # document delete, user delete and the resilience checks. Without
    # DATABASE_URL they did not skip, they CRASHED the runner mid-suite, and
    # every push to this branch went red: 40 consecutive failures with zero
    # successes, for long enough that the notification stopped meaning
    # anything. Those five cover ownership isolation and deletion — the
    # suites you least want unrun — so the fix is to give CI a database, not
    # to skip them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renderball_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renderball_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # The schema must exist before any suite touches it.
      - run: npx prisma migrate deploy
      # The render-truth suite (animation-clock.test.ts) renders REAL MP4
      # frames and extracts them with system ffmpeg — not on the runner image.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx tsc --noEmit
      # tsc --noEmit above reads only the product scope (app/lib/components/src).
      # qa/ and scripts/ live outside it, so they need their own pass or they go
      # unchecked in CI exactly as they did locally.
      - run: npm run typecheck:qa
      - run: node scripts/run-tests.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Build-time-only placeholders: pages are dynamic (no DB access at build),
      # and Clerk needs a format-valid publishable key present to compile.
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
